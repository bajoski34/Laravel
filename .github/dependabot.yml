# Keeps the pinned GitHub Actions and the docs' npm packages up to date.
# Actions are pinned to commit SHAs, so these PRs are how they get updated.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ['*']
    commit-message:
      prefix: docs

  - package-ecosystem: npm
    directory: /tests/js
    schedule:
      interval: monthly
    ignore:
      # svelte-check (latest 4.7.6) only supports TypeScript 5 and 6, so TypeScript 7
      # can't be installed with it. Remove this once svelte-check supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      frontend-tests:
        patterns: ['*']
    commit-message:
      prefix: test
