name: Tests

on:
  # Skipped only when every changed file is listed here; a push that also touches code still runs.
  push:
    branches: [ "2.x", "master", "main" ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '9',  testbench: '7' }
          - { php: '8.1', laravel: '10', testbench: '8' }
          - { php: '8.2', laravel: '11', testbench: '9' }
          - { php: '8.3', laravel: '12', testbench: '10' }
          - { php: '8.4', laravel: '13', testbench: '11' }
          - { php: '8.5', laravel: '13', testbench: '11' }

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" "illuminate/console:^${{ matrix.laravel }}.0" "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/view:^${{ matrix.laravel }}.0" --no-update
          composer require "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-update
          composer update --prefer-dist --no-progress --no-interaction -W

      - name: Run test suite
        run: vendor/bin/pest

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/pint --test

  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # package.json pins the latest versions (Inertia 3); the other rows override them.
          - { framework: react, label: 'Inertia 3, React 19' }
          - { framework: react, label: 'Inertia 2, React 19', packages: '@inertiajs/react@2.3.28' }
          - { framework: react, label: 'Inertia 1, React 18', packages: '@inertiajs/react@1.3.0 react@18.3.1 react-dom@18.3.1 @types/react@18.3.23' }
          - { framework: vue, label: 'Inertia 3' }
          - { framework: vue, label: 'Inertia 2', packages: '@inertiajs/vue3@2.3.28' }
          - { framework: vue, label: 'Inertia 1', packages: '@inertiajs/vue3@1.3.0' }
          - { framework: svelte, label: 'Inertia 3, Svelte 5' }
          - { framework: svelte, label: 'Inertia 2, Svelte 5', packages: '@inertiajs/svelte@2.3.28' }
          - { framework: svelte, label: 'Inertia 1, Svelte 5', packages: '@inertiajs/svelte@1.3.0' }

    name: ${{ matrix.framework }} (${{ matrix.label }})

    defaults:
      run:
        working-directory: tests/js

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - if: matrix.packages
        run: npm install --no-save --no-audit --no-fund ${{ matrix.packages }}
      - run: npm run typecheck:${{ matrix.framework }}
